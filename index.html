  }

  function salvarCorrecao(eanConfirmado) {
    var l = app.historico.editando;
    var novos = {}, antes = {};
    document.querySelectorAll('[data-editar]').forEach(function (inp) {
      var k = inp.getAttribute('data-editar');
      if (inp.value.trim() !== String(l.campos[k] || '').trim()) { novos[k] = inp.value.trim(); antes[k] = l.campos[k]; }
    });
    if (!Object.keys(novos).length) { app.historico.editando = null; renderLinhas(); return; }
    var b = $('btnSalvarCorrecao');
    b.disabled = true; b.textContent = 'Salvando…';
    chamar('apiCorrigir', { planilhaId: app.planilha.id, aba: app.planilha.aba, id: l.id, linha: l.linha, antes: antes, novos: novos, eanConfirmado: !!eanConfirmado }).then(function (r) {
      app.historico.editando = null;
      corrigirLote(app.planilha.id, l.campos, novos);
      aviso('Correção salva na planilha (' + r.alterados.length + ' campo(s)).');
      carregarHistorico();
    }).catch(function (e) {
      b.disabled = false; b.textContent = 'Salvar correção';
      if (e.codigo === 'EAN_INVALIDO') { if (confirm(e.message + '\n\nSalvar mesmo assim?')) salvarCorrecao(true); return; }
      aviso(e.message, true);
      if (e.codigo === 'REGISTRO_APAGADO' || e.codigo === 'LINHA_MUDOU') { app.historico.editando = null; carregarHistorico(); }
    });
  }

  function corrigirSalvo(c) {
    abrirHistorico();
    var tentar = setInterval(function () {
      if (!app.historico || app.painel !== 'historico') { clearInterval(tentar); return; }
      var i = app.historico.linhas.findIndex(function (l) { return l.id === c.id; });
      if (i >= 0) { clearInterval(tentar); editarLinha(i); }
    }, 300);
    setTimeout(function () { clearInterval(tentar); }, 15000);
  }

  // ---------- mais rápido: servidor acordado, som, NF e memória no aparelho, gravação em grupo ----------
  /** Com a tela aberta e em uso, uma chamada leve a cada 4 min: o Google não "esfria" e a próxima leitura não espera. */
  var ACORDAR_MS = 240000, USO_MS = 1200000, usadoEm = Date.now();
  function acordar() {
    if (!app.versao || document.visibilityState === 'hidden' || Date.now() - usadoEm > USO_MS) return;
    if (SITE && !Login.valido()) return;   // sem login não chama (não abre a tela de entrar sozinho)
    chamar('apiAcordar').catch(function () { /* só para manter o Google pronto */ });
  }
  function ligarAcordar() {
    ['pointerdown', 'keydown'].forEach(function (ev) {
      document.addEventListener(ev, function () { usadoEm = Date.now(); destravarSom(); }, true);
    });
    setInterval(acordar, ACORDAR_MS);
    document.addEventListener('visibilitychange', function () {
      if (document.visibilityState === 'visible') { usadoEm = Date.now(); acordar(); }
    });
  }

  /** Bip curto ao salvar e dois graves quando precisa conferir (dá para desligar em Situação). */
  var somCtx = null, ultimoBip = 0;
  function somLigado() { return lembrar('som', true) !== false; }
  function destravarSom() {
    try {
      if (!somCtx) { var A = window.AudioContext || window.webkitAudioContext; if (A) somCtx = new A(); }
      if (somCtx && somCtx.state === 'suspended') somCtx.resume();
    } catch (e) { somCtx = null; }
  }
  function bip(tipo) {
    if (!somLigado() || !somCtx || Date.now() - ultimoBip < 150) return;   // vários salvos juntos: um bip só
    ultimoBip = Date.now();
    var notas = { salvo: [[880, 0, 0.09]], conferir: [[520, 0, 0.12], [390, 0.17, 0.16]], captura: [[1320, 0, 0.05]] }[tipo] || [];
    try {
      var t = somCtx.currentTime;
      notas.forEach(function (n) {
        var o = somCtx.createOscillator(), g = somCtx.createGain();
        o.type = 'sine'; o.frequency.value = n[0];
        g.gain.setValueAtTime(0.0001, t + n[1]);
        g.gain.exponentialRampToValueAtTime(0.25, t + n[1] + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + n[1] + n[2]);
        o.connect(g); g.connect(somCtx.destination);
        o.start(t + n[1]); o.stop(t + n[1] + n[2] + 0.02);
      });
    } catch (e) { /* sem som neste aparelho */ }
  }

  // Conferências iguais às do servidor (EAN, IMEI e serial), para resolver no aparelho.
  function gtinOk(d) {
    var s = 0;
    for (var i = d.length - 2, p = 3; i >= 0; i--, p = p === 3 ? 1 : 3) s += Number(d[i]) * p;
    return (10 - (s % 10)) % 10 === Number(d[d.length - 1]);
  }
  function eanDe(v) {
    var d = String(v || '').replace(/[\s-]/g, '');
    if (!/^\d+$/.test(d)) return '';
    if (d.length === 12) d = '0' + d;
    return (d.length === 13 || d.length === 8) && gtinOk(d) ? d : '';
  }
  function gtin14De(v) { var d = String(v || '').replace(/[\s-]/g, ''); return /^\d{14}$/.test(d) && gtinOk(d) ? d : ''; }
  function imeiDe(v) {
    var d = String(v || '').replace(/[\s\-\/]/g, '');
    if (!/^\d{15}$/.test(d) || /^0+$/.test(d)) return '';
    var s = 0;
    for (var i = 0; i < 15; i++) { var n = Number(d[14 - i]); if (i % 2 === 1) { n *= 2; if (n > 9) n -= 9; } s += n; }
    return s % 10 === 0 ? d : '';
  }
  function serialDe(v) {
    var x = String(v || '').toUpperCase().replace(/\s+/g, '').replace(/^(S\/N[:#.]?|(SN|SERIALNO|SERIAL|NS)[:#.])/, '');
    return /^[A-Z0-9][A-Z0-9\-\/]{3,39}$/.test(x) ? x : '';
  }
  function unicos(l) { return l.filter(function (v, i) { return v && l.indexOf(v) === i; }); }
  function mesmoFormato(s, modelos) {
    return modelos.some(function (m) { m = String(m || '').toUpperCase(); return m.length === s.length && m.slice(0, 2) === s.slice(0, 2) && /\d/.test(s) === /\d/.test(m); });
  }
  function codigoEhSerial(codigo, serial) {
    var c = String(codigo || '').toUpperCase().replace(/\s+/g, '');
    return c === serial || c === 'S' + serial || (c.indexOf('1S') === 0 && c.length > serial.length + 2 && c.slice(-serial.length) === serial);
  }

  /** Memória do aparelho: a resposta certa da Memória Global para cada EAN, por 15 dias. */
  var MEMORIA_DIAS = 15;
  function memoriasLocais() {
    var m = lembrar('memoriaLocal', {}), limite = Date.now() - MEMORIA_DIAS * 864e5;
    Object.keys(m).forEach(function (k) { if (!m[k] || m[k].quando < limite) delete m[k]; });
    return m;
  }
  function guardarMemoria(ean, x) {
    if (!ean || !x || !x.nome) return;
    var m = memoriasLocais();
    m[ean] = { nome: String(x.nome).slice(0, 200), marca: x.marca || '', item_id: x.item_id || '', quando: Date.now() };
    Object.keys(m).sort(function (a, b) { return m[b].quando - m[a].quando; }).slice(300).forEach(function (k) { delete m[k]; });
    guardar('memoriaLocal', m);
  }
  function esquecerMemoria(ean) {
    if (!ean) return;
    var m = memoriasLocais();
    if (m[ean]) { delete m[ean]; guardar('memoriaLocal', m); }
  }
  function memoriaDe(codigos) {
    var m = memoriasLocais(), achado = null;
    (codigos || []).some(function (k) { var e = eanDe(k.valor); if (e && m[e]) achado = { ean: e, nome: m[e].nome, marca: m[e].marca, item_id: m[e].item_id }; return !!achado; });
    return achado;
  }

  /** Itens das NFs desta entrada, baixados uma vez para o aparelho (null = ainda não chegaram). */
  var nfAparelho = { chave: '', planilhaId: '', nfs: '', itens: null, progresso: null };
  var relogioNf = null, relogioProgresso = null;
  function chaveNf() { return app.planilha ? app.planilha.id + '|' + app.planilha.aba + '|' + numerosNf($('nfe').value).join(',') : ''; }
  function carregarNf() {
    clearTimeout(relogioNf);
    relogioNf = setTimeout(function () {
      var k = chaveNf(), nfs = numerosNf($('nfe').value);
      if (k === nfAparelho.chave) return;
      nfAparelho = { chave: k, planilhaId: app.planilha ? app.planilha.id : '', nfs: nfs.join(','), itens: null, progresso: null };
      mostrarNfe();
      if (!app.planilha || !nfs.length || app.ajuda) return;
      chamar('apiItensNf', { planilhaId: app.planilha.id, nfe: nfs.join(', ') }).then(function (r) {
        if (nfAparelho.chave !== k) return;
        nfAparelho.itens = r.itens || [];
        // A memória já é consultada para todos os EANs da nota, antes da primeira foto.
        preconsultarTodos(nfAparelho.itens.map(function (it) { return it.ean; }));
      }).catch(function () { /* sem a nota no aparelho, o servidor confere */ });
      atualizarProgresso(0);
    }, 600);
  }
  function preconsultarTodos(eans) {
    var falta = unicos((eans || []).filter(function (e) { return e && !(e in previa); }));
    var i = 0;
    (function proximo() {
      var parte = falta.slice(i, i + 5);
      i += 5;
      if (parte.length) preconsultar(parte.map(function (e) { return { valor: e, formato: 'EAN_13' }; }), proximo);
    })();
  }
  /** Quanto falta da NF: aparece no botão da nota ("34 de 50 lidos") e em cada produto salvo. */
  function atualizarProgresso(atraso) {
    clearTimeout(relogioProgresso);
    relogioProgresso = setTimeout(function () {
      var k = chaveNf();
      if (!app.planilha || app.ajuda || !numerosNf($('nfe').value).length) return;
      chamar('apiProgressoNf', { planilhaId: app.planilha.id, aba: app.planilha.aba, nfe: $('nfe').value.trim() }).then(function (r) {
        if (chaveNf() !== k || nfAparelho.chave !== k) return;
        var pr = { lidos: 0, total: 0, itens: [] };
        (r.notas || []).forEach(function (n) {
          pr.lidos += n.lidos; pr.total += n.total;
          n.itens.forEach(function (it) { pr.itens.push({ numero: n.numero, ean: it.ean, lidos: it.lidos, total: it.total }); });
        });
        nfAparelho.progresso = pr;
        mostrarNfe();
        app.cartoes.forEach(function (c) { if (c.estado === 'salvo' && noDestino(c)) renderCartao(c); });
      }).catch(function () { /* o progresso é só informação */ });
    }, atraso == null ? 1500 : atraso);
  }
  function progressoDoCartao(c) {
    var pr = nfAparelho.progresso;
    if (!pr || nfAparelho.chave !== chaveNf() || !c.valores.EAN) return '';
    var nfs = numerosNf(c.nfe);
    var it = pr.itens.filter(function (x) { return x.ean === c.valores.EAN && (!nfs.length || nfs.indexOf(x.numero) >= 0); })[0];
    return it ? 'NF ' + it.numero + ': ' + it.lidos + ' de ' + it.total + ' deste modelo' : '';
  }

  /**
   * Resolve no próprio aparelho, sem esperar o servidor, quando há referência certa e o serial confere:
   * descrição do produto anterior igual (lote), da memória guardada ou do item da NF, e IMEI válido ou
   * serial da nota / no formato dos anteriores. Qualquer dúvida vai para o servidor, como sempre.
   */
  /** Marca conhecida que aparece na descrição (a mesma regra do servidor), ou ''. */
  function marcaDaDescricao(desc) {
    var t = ' ' + String(desc || '').toUpperCase().replace(/[^A-Z0-9À-Ú+]+/g, ' ') + ' ';
    var achada = '', pos = Infinity;
    (app.marcas || []).forEach(function (m) {
      var i = t.indexOf(' ' + String(m).toUpperCase() + ' ');
      if (i >= 0 && (i < pos || (i === pos && m.length > achada.length))) { pos = i; achada = String(m).toUpperCase(); }
    });
    return achada;
  }

  function resolverNoAparelho(codigos, o) {
    if (o.forcarIA || !codigos.length) return null;
    if ((o.extras || []).some(function (k) { return k !== 'MARCA'; })) return null;
    var eans = unicos(codigos.map(function (k) { return eanDe(k.valor); }));
    if (eans.length !== 1) return null;
    var ean = eans[0];
    var nfs = numerosNf(o.nfe);
    var itensNf = null;
    if (nfs.length) {
      if (nfAparelho.planilhaId !== o.planilhaId || nfAparelho.nfs !== nfs.join(',') || !nfAparelho.itens) return null;
      itensNf = nfAparelho.itens;
    }
    var item = itensNf ? itensNf.filter(function (it) { return it.ean === ean; })[0] : null;
    if (itensNf && itensNf.some(function (it) { return it.ean; }) && !item) return null;   // fora da nota: o servidor avisa
    var lote = loteDe(codigos, o.planilhaId);
    if (lote && lote.ean !== ean) lote = null;
    var mem = memoriaDe(codigos);
    if (mem && mem.ean !== ean) mem = null;
    var ref = lote ? { nome: lote.descricao, marca: lote.marca || '', fonte: 'lote', nota: 'Igual ao produto anterior deste modelo (mesmo EAN).' }
      : mem ? { nome: mem.nome, marca: mem.marca || '', fonte: 'aparelho', nota: 'Descrição da Memória Global (guardada neste aparelho).' }
      : item && item.descricao ? { nome: item.descricao, marca: '', fonte: 'nota', nota: 'Descrição da nota fiscal (NF ' + item.numero + ').' } : null;
    if (!ref) return null;
    if (!ref.marca) ref.marca = marcaDaDescricao(ref.nome);
    if ((o.extras || []).indexOf('MARCA') >= 0 && !ref.marca) return null;
    // Serial: as mesmas regras do servidor sem IA.
    var imeis = [], outros = [];
    for (var i = 0; i < codigos.length; i++) {
      var v = codigos[i].valor;
      if (/^(EAN|UPC)/i.test(codigos[i].formato || '') || eanDe(v) || gtin14De(v)) continue;
      if (/dell\.com|[?&=]/i.test(String(v))) return null;   // QR com link: o servidor sabe ler
      var im = imeiDe(v);
      if (im) { imeis.push(im); continue; }
      var sv = serialDe(v);
      if (sv && /[A-Z]/.test(sv) && /\d/.test(sv)) outros.push(sv);
    }
    imeis = unicos(imeis); outros = unicos(outros);
    var serial = '', notaSerial = '';
    if (imeis.length > 2) return null;
    if (imeis.length) { serial = imeis.join(' / '); notaSerial = imeis.length === 2 ? 'IMEI 1 / IMEI 2, conferidos.' : 'IMEI conferido.'; }
    else {
      var daNota = ((item && item.seriais) || []).map(function (x) { return String(x).toUpperCase(); });
      var naNota = daNota.filter(function (s) { return codigos.some(function (k) { return codigoEhSerial(k.valor, s); }); });
      var modelos = daNota.concat((lote && lote.seriais) || []);
      if (naNota.length === 1) { serial = naNota[0]; notaSerial = 'Serial confere com a nota fiscal.'; }
      else if (modelos.length) {
        var bons = outros.filter(function (s) { return mesmoFormato(s, modelos); });
        if (bons.length === 1) { serial = bons[0]; notaSerial = 'Serial no mesmo formato dos outros deste modelo.'; }
      }
    }
    if (!serial) return null;
    var desc = ref.nome;
    if (ref.marca && String(desc).toUpperCase().indexOf(String(ref.marca).toUpperCase()) < 0) desc = ref.marca + ' ' + desc;
    var campos = {
      DESCRICAO: { valor: desc, estado: 'ok', origem: 'memoria', nota: ref.nota },
      SERIAL: { valor: serial, estado: 'ok', origem: 'leitor', nota: notaSerial },
      EAN: { valor: ean, estado: 'ok', origem: 'leitor', nota: 'EAN lido no código de barras.' }
    };
    if ((o.extras || []).indexOf('MARCA') >= 0) campos.MARCA = { valor: ref.marca, estado: 'ok', origem: 'memoria', nota: '' };
    return {
      ok: true, campos: campos, situacao: 'pronto', divergencias: [], avisos: [], etiquetas: [], etiquetasConhecidas: [],
      usouIA: false, iaDispensada: true, usouInternet: false, fonte: ref.fonte, noAparelho: true, marca: ref.marca,
      memoria: mem && ref.fonte === 'aparelho' ? { item_id: mem.item_id, nome: mem.nome, marca: mem.marca, certeza: 100, confiavel: true } : null,
      tempos: { total: 0 }
    };
  }

  /** O mesmo serial já foi salvo neste aparelho (mesma planilha e aba)? Devolve o aviso, ou ''. */
  function partesSerial(v) { return String(v || '').toUpperCase().split(/\s*[\/,;]\s*/).map(function (x) { return x.trim(); }).filter(function (x) { return x.length >= 5; }); }
  function serialJaSalvo(c, serial) {
    var meus = partesSerial(serial);
    if (!meus.length) return '';
    var outro = app.cartoes.filter(function (x) {
      return x !== c && (x.estado === 'salvo' || x.estado === 'salvando') && x.planilhaId === c.planilhaId && (x.aba || '') === (c.aba || '') &&
        partesSerial(x.valores.SERIAL).some(function (s) { return meus.indexOf(s) >= 0; });
    })[0];
    if (!outro) return '';
    var igual = partesSerial(outro.valores.SERIAL).filter(function (s) { return meus.indexOf(s) >= 0; })[0];
    return 'O serial ' + igual + ' já foi salvo agora há pouco' + (outro.linha ? ' (linha ' + outro.linha + ')' : '') + '. Confira se não é a mesma unidade lida duas vezes.';
  }

  /** Gravação em grupo: o que fica pronto enquanto uma gravação está em andamento vai junto na próxima. */
  var paraGravar = [], gravandoGrupo = false;
  function gravarEmGrupo(pedido) {
    return new Promise(function (ok, falha) {
      paraGravar.push({ pedido: pedido, ok: ok, falha: falha });
      setTimeout(descarregarGrupo, 120);
    });
  }
  function descarregarGrupo() {
    if (gravandoGrupo || !paraGravar.length) return;
    var p0 = paraGravar[0].pedido;
    var grupo = paraGravar.filter(function (x) { return x.pedido.planilhaId === p0.planilhaId && x.pedido.aba === p0.aba; }).slice(0, 10);
    paraGravar = paraGravar.filter(function (x) { return grupo.indexOf(x) < 0; });
    gravandoGrupo = true;
    var envio = grupo.length === 1
      ? chamar('apiSalvar', p0).then(function (r) { return [r]; }, function (e) { return [{ ok: false, falhou: e }]; })
      : chamar('apiSalvarVarios', { planilhaId: p0.planilhaId, aba: p0.aba, itens: grupo.map(function (x) { return { registroId: x.pedido.registroId, campos: x.pedido.campos }; }) }).then(function (r) { return r.resultados || []; });
    envio.then(function (rs) {
      grupo.forEach(function (x, i) {
        var r = rs[i];
        if (r && r.ok) x.ok(r);
        else x.falha(r && r.falhou ? r.falhou : new ErroApp((r && r.erro) || { codigo: 'ERRO', mensagem: 'O Google não confirmou a gravação.' }));
      });
    }, function (e) {
      grupo.forEach(function (x) { x.falha(e); });
    }).then(function () { gravandoGrupo = false; descarregarGrupo(); });
  }

  /**
   * Para a IA vai só a parte da foto em volta dos códigos lidos (com folga para o texto da etiqueta).
   * Sem códigos com posição, ou etiqueta ocupando quase a foto toda, vai a foto inteira.
   */
  function recortarEtiqueta(f) {
    if (!f.full) return Promise.resolve('');
    var caixas = (f.codigos || []).map(function (k) { return k.caixa; }).filter(Boolean);
    if (!caixas.length) return Promise.resolve(f.full);
    var x0 = 100, y0 = 100, x1 = 0, y1 = 0;
    caixas.forEach(function (b) { x0 = Math.min(x0, b.x); y0 = Math.min(y0, b.y); x1 = Math.max(x1, b.x + b.l); y1 = Math.max(y1, b.y + b.a); });
    // Código de barras 1D só dá a posição de uma linha: folga grande em cima e embaixo (modelo e textos).
    var mx = Math.max(18, (x1 - x0) * 0.6), my = Math.max(25, (y1 - y0) * 1.2);
    x0 = Math.max(0, x0 - mx); y0 = Math.max(0, y0 - my); x1 = Math.min(100, x1 + mx); y1 = Math.min(100, y1 + my);
    // Nunca menor que 45% da foto em cada lado: o texto do modelo costuma estar perto, mas não colado.
    function minimo(a, b) { var falta = 45 - (b - a); if (falta <= 0) return [a, b]; a = Math.max(0, a - falta / 2); return [a, Math.min(100, a + 45)]; }
    var h = minimo(x0, x1), v = minimo(y0, y1);
    x0 = h[0]; x1 = h[1]; y0 = v[0]; y1 = v[1];
    if ((x1 - x0) * (y1 - y0) > 6000) return Promise.resolve(f.full);
    return carregarImagem(dataParaBlob(f.full)).then(function (img) {
      var c = desenhar(img, LADO_MAX);
      return recorte(c, x0 / 100, y0 / 100, (x1 - x0) / 100, (y1 - y0) / 100).toDataURL('image/jpeg', QUALIDADE);
    }).catch(function () { return f.full; });
  }

      if (t.id === 'btnNfLerPlanilha') { lerNfPlanilha(); return; }
      if (t.id === 'btnNfSalvar') { salvarNf(false); return; }
      if (t.id === 'btnNfDescartar') { nfLida = null; $('nfLeitura').innerHTML = ''; return; }
      if (t.id === 'btnNfeUsar') { adicionarNf($('nfeUsar').value); return; }
      if (t.hasAttribute('data-tirar-nf')) { tirarNf(t.getAttribute('data-tirar-nf')); return; }
      if (t.hasAttribute('data-escolher-nf')) { mostrarLeitura([nfsLidas[Number(t.getAttribute('data-escolher-nf'))]]); return; }
      if (t.hasAttribute('data-nf')) { adicionarNf(t.getAttribute('data-nf')); return; }
      if (t.hasAttribute('data-auditar')) { auditarNf(t.getAttribute('data-auditar')); return; }
      if (t.hasAttribute('data-etiquetas-nf')) { abrirEtiquetas('&nf=' + encodeURIComponent(t.getAttribute('data-etiquetas-nf'))); return; }
      if (t.hasAttribute('data-usar')) usarPlanilha(t.getAttribute('data-usar'), t, t.getAttribute('data-usar-aba'));
      else if (t.hasAttribute('data-aba')) usarPlanilha(app.planilha.id, t, t.getAttribute('data-aba'));
      else if (t.hasAttribute('data-extra')) adicionarExtra(t);
      else if (t.id === 'btnNovaAba') { if ($('novaAba').value.trim()) usarPlanilha(app.planilha.id, t, $('novaAba').value.trim()); else $('novaAba').focus(); }
      else if (t.id === 'btnUsarLink') usarPlanilha($('linkPlanilha').value, t);
      else if (t.hasAttribute('data-linha')) editarLinha(Number(t.getAttribute('data-linha')));
      else if (t.id === 'btnSalvarCorrecao') salvarCorrecao();
      else if (t.id === 'btnCancelarCorrecao') { app.historico.editando = null; carregarHistorico(); renderLinhas(); }
      else if (t.hasAttribute('data-ir')) {
        fecharPainel();
        var el = document.querySelector('[data-cartao="' + t.getAttribute('data-ir') + '"]');
        if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    });
    var tempoBusca = null;
    $('painelCorpo').addEventListener('input', function (e) {
      if (e.target.id === 'busca') { clearTimeout(tempoBusca); tempoBusca = setTimeout(carregarHistorico, 400); }
      if (e.target.id === 'buscaDrive') { clearTimeout(tempoBusca); tempoBusca = setTimeout(buscarNoDrive, 400); }
    });
    $('painelCorpo').addEventListener('keydown', function (e) {
      if (e.key !== 'Enter') return;
      if (e.target.id === 'campoCodigo') { e.preventDefault(); usarCodigo(); return; }
      if (e.target.id === 'nfeUsar') { e.preventDefault(); adicionarNf(e.target.value); return; }
      if (e.target.id === 'nfLink') { e.preventDefault(); lerNfPlanilha(); return; }
      if (e.target.id === 'buscaDrive') { e.preventDefault(); buscarNoDrive(); }
      else if (e.target.id === 'novaAba') { e.preventDefault(); $('btnNovaAba').click(); }
      else if (e.target.id === 'linkPlanilha') { e.preventDefault(); $('btnUsarLink').click(); }
    });
    document.addEventListener('visibilitychange', function () { if (!document.hidden && app.painel === 'historico') carregarHistorico(); });
  }

  function cartaoDe(el) {
    var id = el.closest('[data-cartao]').getAttribute('data-cartao');
    return app.cartoes.filter(function (c) { return c.id === id; })[0];
  }

  function verFoto(src, link) {
    if (link && !src) { window.open(link, '_blank'); return; }
    var g = $('fotoGrande');
    g.querySelector('img').src = src;
    g.className = 'foto-grande';
  }

  // ---------- início ----------
  function iniciar() {
    ligarEventos();
    renderMiniaturas();
    var p = lembrar('planilha', null);
    if (p) definirPlanilha(p);
    app.ajuda = lembrar('ajuda', null);
    if (app.ajuda) { app.planilhaPropria = app.planilha; aplicarModoAjuda(); }
    Banco.todos().then(function (lista) {
      var limite = Date.now() - 12 * 3600 * 1000;
      (lista || []).sort(function (a, b) { return b.criadoEm - a.criadoEm; }).forEach(function (c) {
        if (c.estado === 'salvo' && !c.fotosPendentes && (c.salvoEm || c.criadoEm) < limite) { Banco.apagar(c.id); return; }
        app.cartoes.push(c);
      });
      app.cartoes.forEach(renderCartao);
      renderResumo();
      conferirTela();
      // Retoma o que ficou no meio (página fechada durante o envio).
      app.cartoes.forEach(function (c) {
        if (c.estado === 'lendo' || c.estado === 'enviando' || c.estado === 'analisando') processar(c);
        if (c.estado === 'salvando') { c.estado = 'revisar'; salvar(c); }
        else if (c.estado === 'revisar') enviarFotos(c).catch(function () { /* tenta de novo ao salvar */ });
        else if (c.fotosPendentes) completarFotos(c);
      });
    });
    entrar();
    carregarZXing().catch(function () { /* tenta de novo na primeira foto */ });
  }

  /** Dados do início (versão, se é o dono, código da equipe...). Guardados no aparelho para a tela abrir já pronta. */
  function aplicarInicio(r) {
    app.email = r.email || ''; if (SITE) Login.anotarConta(app.email); app.meuCodigo = r.meuCodigo || ''; app.paraAprovar = r.paraAprovar || 0;
    app.urlApp = r.urlApp || ''; app.versao = r.versao; $('versao').textContent = 'v' + r.versao; app.planilhas = r.planilhas || []; app.iaLigada = r.iaLigada; app.memoriaLigada = r.memoriaLigada; app.memoriaInstalada = r.memoriaInstalada; app.cosmosLigado = r.cosmosLigado; app.extrasDisponiveis = r.extrasDisponiveis || []; app.marcas = r.marcas || [];
    $('bolinhaConfig').className = 'bolinha' + (app.paraAprovar ? '' : ' oculto');
    $('bolinhaConfig').textContent = app.paraAprovar ? String(app.paraAprovar) : '!';
    if (app.painel === 'config') abrirConfig();
  }

  function entrar() {
    var guardado = lembrar('inicio', null);
    if (guardado && guardado.r) aplicarInicio(guardado.r);
    chamar('apiIniciar').then(function (r) {
      aplicarInicio(r);
      guardar('inicio', { r: r });
      if (r.paraAprovar) aviso(r.paraAprovar === 1 ? 'Um produto esperando sua aprovação (Situação).' : r.paraAprovar + ' produtos esperando sua aprovação (Situação).');
      esvaziarEnsino();
      if (app.ajuda) {   // confere se o código ainda vale e se as abas mudaram
        chamar('apiDestinoAjuda', app.ajuda.codigo).then(function (d) {
          app.ajuda.dono = d.dono; app.ajuda.abas = d.abas;
          if (d.abas.indexOf(app.ajuda.aba) < 0) { app.destinoAjuda = d; abrirAjudar(d); aviso('A aba ' + app.ajuda.aba + ' não existe mais. Escolha outra.', true); }
          guardar('ajuda', app.ajuda);
        }).catch(function (e) { if (e.codigo === 'CODIGO_PROPRIO') mesmaConta(); else if (e.app) { aviso(e.message, true); pararAjuda(); } });
        return;
      }
      // Relê a planilha escolhida: abas e colunas extras podem ter mudado direto no Google Planilhas.
      if (app.planilha) chamar('apiEscolherPlanilha', app.planilha.id, app.planilha.aba).then(function (x) { definirPlanilha(x.planilha); }).catch(function () { /* segue com o que já sabe */ });
      if (!app.planilha && app.planilhas.length) definirPlanilha(app.planilhas[0]);
      if (!app.planilha) abrirPlanilhas();
      else if (!$('caixa').value) $('caixa').focus();
    }).catch(function (e) { aviso(e.message, true); });
  }

  window.SCAN = { app: app, lerCodigos: lerCodigos };   // para os testes automáticos
  iniciar();
})();
</script>

</body>
</html>
