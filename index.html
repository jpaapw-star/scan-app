<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SCAN">
  <title>SCAN</title>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&display=swap" rel="stylesheet">
  <script>try { document.documentElement.setAttribute('data-tema', JSON.parse(localStorage.getItem('scan:tema')) || 'escuro'); } catch (e) {}</script>
  <style>
  /*
   * Visual do SCAN ("escuro elegante", escolhido pelo João): só preto, branco e cinza.
   * Dois temas: escuro (padrão) e claro, escolhidos em Situação e guardados no aparelho
   * (atributo data-tema no <html>). Cartões arredondados com borda fina, botões em pílula,
   * barra de navegação flutuante embaixo no celular e em pílula no topo do computador.
   * A situação de cada campo/produto aparece por tom e ícone (sem cores):
   *   ok = cinza com ✓ · conferir = contorno tracejado · divergente/falta = cheio no contraste máximo.
   */
  :root {
    --fundo: #0a0a0a;
    --cartao: #151515;
    --campo: #1f1f1f;
    --campo-fundo: #0b0b0b;
    --borda: #232323;
    --texto: #f2f2f2;
    --suave: #8f8f8f;
    --fraco: #6d6d6d;
    --linha: #262626;
    --linha-forte: #3a3a3a;
    --forte: #f2f2f2;
    --sobre-forte: #0a0a0a;
    --nav-fundo: rgba(22,22,22,.94);
    --ok: #d6d6d6;
    --ok-fundo: #262626;
    --conferir: #bdbdbd;
    --conferir-fundo: #151515;
    --divergente: #f2f2f2;
    --divergente-fundo: #f2f2f2;
    --sobre-divergente: #0a0a0a;
    --raio: 24px;
    --raio-p: 14px;
    --sombra: none;
    --toque: 46px;
    --nav: 68px;
    color-scheme: dark;
  }
  :root[data-tema="claro"] {
    --fundo: #efefef; --cartao: #ffffff; --campo: #f0f0f0; --campo-fundo: #f7f7f7; --borda: #e2e2e2;
    --texto: #0d0d0d; --suave: #5e5e5e; --fraco: #9a9a9a; --linha: #e3e3e3; --linha-forte: #c4c4c4;
    --forte: #0d0d0d; --sobre-forte: #ffffff; --nav-fundo: rgba(255,255,255,.94);
    --ok: #2b2b2b; --ok-fundo: #e9e9e9; --conferir: #4a4a4a; --conferir-fundo: #ffffff;
    --divergente: #0d0d0d; --divergente-fundo: #0d0d0d; --sobre-divergente: #ffffff;
    --sombra: 0 1px 2px rgba(0,0,0,.04), 0 8px 24px rgba(0,0,0,.05);
    color-scheme: light;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--fundo); color: var(--texto); }
  body { font: 15px/1.45 "Sora", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-text-size-adjust: 100%; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
  a { color: inherit; }
  .oculto { display: none !important; }

  /* ---------- topo: logo, planilha, menu e o cartão da caixa ---------- */
  .barra {
    position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; background: var(--fundo);
    padding: calc(12px + env(safe-area-inset-top)) 14px 12px; max-width: 1100px; margin: 0 auto;
  }
  /* O logo acompanha o tema: no escuro fica como o original (preto); no claro, com as cores invertidas. */
  /* Logo sem fundo próprio (transparente): fica na cor da tela em qualquer tema. */
  .logo { width: 60px; height: 60px; display: block; flex: none; }
  :root[data-tema="claro"] .logo { filter: invert(1); }
  @media (min-width: 900px) { .logo { width: 68px; height: 68px; } }
  .planilha {
    flex: 0 1 auto; min-width: 0; max-width: 420px; margin-right: auto; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px 0 14px;
    border: 1px solid var(--borda); border-radius: 999px; background: var(--cartao); color: var(--texto); font-size: 13.5px; text-align: left;
  }
  .planilha span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .planilha small { color: var(--suave); font-size: inherit; }
  .planilha svg { flex: none; opacity: .7; }
  .versao { display: none; }

  .hero {
    width: calc(100% - 28px); max-width: 1072px; margin: 4px auto 0; padding: 18px;
    background: var(--cartao); border: 1px solid var(--borda); border-radius: 26px; box-shadow: var(--sombra);
  }
  .caixa-cab { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .caixa-cab .rotulo { margin: 0; }
  .caixa-cab .rotulo small { display: block; font-size: 11px; letter-spacing: .04em; text-transform: none; color: var(--fraco); font-weight: 400; }
  .hero input.caixa {
    width: 100%; height: 60px; font-size: 26px; font-weight: 700; text-align: center; letter-spacing: .08em; text-transform: uppercase;
    background: var(--campo-fundo); border: 1px solid var(--linha-forte); color: var(--texto); border-radius: 18px;
  }
  .hero input.caixa:focus { border-color: var(--forte); box-shadow: none; background: var(--campo-fundo); }
  .hero input.caixa::placeholder { color: var(--fraco); font-size: 15px; font-weight: 400; letter-spacing: 0; text-transform: none; }
  .total-caixa { margin-top: 14px; display: flex; align-items: baseline; gap: 10px; }
  .total-caixa .kpi { font-size: 26px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
  .total-caixa .legenda { color: var(--suave); font-size: 13.5px; }
  .hero-linha { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .pilula {
    display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border-radius: 999px; border: 0;
    background: var(--campo); color: var(--texto); font-size: 13.5px; font-weight: 500; white-space: nowrap; max-width: 100%;
  }
  .pilula span { overflow: hidden; text-overflow: ellipsis; }
  .pilula svg { width: 16px; height: 16px; flex: none; opacity: .8; }
  .pilula.clara { background: var(--forte); color: var(--sobre-forte); font-weight: 600; }
  .nfe-campo { margin-top: 10px; }
  .hero input.entrada { background: var(--campo-fundo); border-color: var(--linha-forte); }
  .hero input.entrada:focus { border-color: var(--forte); box-shadow: none; }
  @media (min-width: 900px) {
    /* No computador: rótulo, caixa, total e nota fiscal numa linha só. */
    .hero { display: grid; grid-template-columns: auto 240px auto 1fr; column-gap: 20px; align-items: center; padding: 20px 24px; border-radius: 28px; }
    .caixa-cab { margin: 0; }
    .total-caixa, .hero-linha { margin-top: 0; }
    .hero-linha { justify-content: flex-end; }
    .nfe-campo { grid-column: 2 / 4; }
  }

  /* ---------- navegação (flutuante embaixo no celular, pílula no topo no computador) ---------- */
  .nav {
    position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 30; height: var(--nav);
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 6px; background: var(--nav-fundo); border-radius: 26px;
    border: 1px solid var(--borda); box-shadow: 0 10px 30px rgba(0,0,0,.25); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .nav button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 3px; color: var(--suave); position: relative; font-size: 10.5px; border-radius: 20px; }
  .nav button svg { width: 22px; height: 22px; }
  .nav button.ativo { background: var(--forte); color: var(--sobre-forte); font-weight: 600; }
  @media (min-width: 900px) {
    .nav { position: static; height: auto; display: flex; gap: 2px; padding: 5px; background: var(--cartao); box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; border-radius: 999px; }
    .nav button { display: flex; align-items: center; gap: 8px; height: 38px; padding: 0 16px; border-radius: 999px; font-size: 13.5px; }
    .nav button svg { width: 17px; height: 17px; }
    .nav button:not(.ativo):hover { color: var(--texto); }
    .nav .bolinha { position: static; margin: 0; }
  }
  .bolinha { position: absolute; top: 4px; left: 50%; margin-left: 6px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--forte); color: var(--sobre-forte); font-size: 11px; line-height: 18px; font-weight: 700; }
  .nav button.ativo .bolinha { background: var(--sobre-forte); color: var(--forte); }
  /* Ajudando outra pessoa: só ler e mandar (sem notas e sem histórico da planilha dela). */
  .modo-ajuda #btnNotas, .modo-ajuda #btnHistorico, .modo-ajuda #btnNfeHero { display: none; }
  .modo-ajuda .nav { grid-template-columns: repeat(2, 1fr); }

  main { max-width: 1100px; margin: 0 auto; padding: 16px 14px calc(var(--nav) + 34px + env(safe-area-inset-bottom)); display: grid; gap: 16px; }
  @media (min-width: 900px) {
    main { grid-template-columns: 390px minmax(0, 1fr); gap: 22px; align-items: start; padding-top: 22px; padding-bottom: 40px; }
    .captura { position: sticky; top: 104px; }
  }
  .captura { display: grid; gap: 16px; }

  .bloco { background: var(--cartao); border: 1px solid var(--borda); border-radius: 26px; padding: 20px; box-shadow: var(--sombra); }
  label.rotulo, .rotulo { display: block; font-size: 11px; font-weight: 500; color: var(--suave); text-transform: uppercase; letter-spacing: .16em; margin: 0 0 8px; }
  input.entrada, textarea.entrada, select.entrada {
    width: 100%; height: var(--toque); padding: 0 14px; border: 1px solid var(--linha); border-radius: var(--raio-p); background: var(--campo); outline: none; min-width: 0;
  }
  textarea.entrada { height: auto; padding: 11px 14px; resize: vertical; line-height: 1.35; }
  input.entrada:focus, textarea.entrada:focus { border-color: var(--forte); background: var(--cartao); }
  input.entrada::placeholder, textarea.entrada::placeholder { color: var(--fraco); }

  /* Fotos */
  .soltar { transition: background .15s; }
  .soltar.arrastando { outline: 2px dashed var(--linha-forte); outline-offset: -8px; }
  #painelCorpo.arrastando { outline: 2px dashed var(--linha-forte); outline-offset: -10px; border-radius: var(--raio); }
  .soltar-nf { display: none; }
  @media (hover: hover) and (pointer: fine) { .soltar-nf { display: block; } }
  .botoes-foto { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .btn {
    height: var(--toque); border-radius: 999px; border: 1px solid var(--forte); background: var(--forte); color: var(--sobre-forte); font-weight: 600;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; white-space: nowrap; text-decoration: none;
  }
  .btn:hover { opacity: .88; }
  .btn svg { width: 20px; height: 20px; flex: none; }
  .btn.sec, .btn.discreto { background: var(--campo); color: var(--texto); border-color: var(--campo); font-weight: 500; }
  .btn.sec:hover, .btn.discreto:hover { border-color: var(--linha-forte); opacity: 1; }
  .btn.principal { background: var(--forte); color: var(--sobre-forte); border-color: var(--forte); }
  .btn.grande { height: 86px; font-size: 15px; border-radius: 20px; flex-direction: column; gap: 6px; }
  .btn.grande svg { width: 22px; height: 22px; }
  .btn.curto { height: 36px; padding: 0 14px; font-size: 13px; border-radius: 999px; }
  .btn:disabled { opacity: .35; cursor: default; }
  .dica { color: var(--suave); font-size: 13px; margin: 10px 2px 0; }
  .miniaturas { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
  .miniaturas:not(:empty) { margin-top: 12px; }
  .mini { position: relative; aspect-ratio: 1; border-radius: 14px; overflow: hidden; background: var(--campo); }
  .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mini .tirar { position: absolute; top: 5px; right: 5px; width: 28px; height: 28px; border-radius: 50%; border: 0; background: rgba(0,0,0,.7); color: #fff; font-size: 16px; line-height: 28px; padding: 0; }
  .mini .num { position: absolute; left: 5px; bottom: 5px; background: rgba(0,0,0,.7); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 999px; }
  .mini .cod { position: absolute; right: 5px; bottom: 5px; background: #fff; color: #0d0d0d; font-size: 11px; padding: 1px 7px; border-radius: 999px; font-weight: 700; }
  .mini .cod.alerta { background: #0d0d0d; color: #fff; font-weight: 600; font-size: 10px; left: 5px; right: 5px; text-align: center; }
  .acoes { display: grid; grid-template-columns: auto 1fr; gap: 10px; margin-top: 14px; }
  .acoes .btn { height: 50px; flex-direction: row; border-radius: 999px; }
  .acoes .btn.sec { background: transparent; border-color: transparent; color: var(--suave); }

  /* Lista de produtos */
  .resultados { display: grid; gap: 12px; align-content: start; }
  .lista-cab { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 0 4px; }
  .lista-cab h2 { font-size: 11.5px; font-weight: 500; letter-spacing: .16em; text-transform: uppercase; color: var(--suave); margin: 0; }
  .contagens { display: flex; gap: 6px; flex-wrap: wrap; }
  .vazio { color: var(--suave); text-align: center; padding: 36px 16px; background: var(--cartao); border: 1px solid var(--borda); border-radius: var(--raio); font-size: 14px; box-shadow: var(--sombra); }

  .selo { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--linha-forte); white-space: nowrap; color: var(--suave); background: var(--cartao); }
  .selo.ok { color: var(--ok); border-color: var(--ok-fundo); background: var(--ok-fundo); }
  .selo.ok::before { content: "✓"; }
  .selo.conferir { color: var(--conferir); border: 1px dashed var(--conferir); background: var(--conferir-fundo); }
  .selo.conferir::before { content: "!"; font-weight: 800; }
  .selo.divergente, .selo.falha { color: var(--sobre-divergente); border-color: var(--divergente); background: var(--divergente-fundo); }
  .selo.divergente::before, .selo.falha::before { content: "✕"; }
  .selo.neutro { background: var(--campo); border-color: var(--campo); }

  .cartao { background: var(--cartao); border-radius: var(--raio); box-shadow: var(--sombra); overflow: hidden; border: 1px solid var(--borda); }
  .cartao.conferir { border: 1.5px dashed var(--conferir); }
  .cartao.divergente, .cartao.falha { border-color: var(--divergente); }
  .cab { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .cab .tiras { display: flex; flex: none; }
  .cab .tiras img { width: 44px; height: 44px; object-fit: cover; border-radius: 12px; border: 2px solid var(--cartao); margin-left: -12px; cursor: zoom-in; }
  .cab .tiras img:first-child { margin-left: 0; }
  .cab .info { flex: 1; min-width: 0; }
  .cab .titulo { font-weight: 600; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; line-height: 1.3; }
  .cab .sub { font-size: 12.5px; color: var(--suave); }
  .corpo { padding: 2px 14px 14px; display: grid; gap: 12px; }
  .progresso { display: flex; align-items: center; gap: 10px; color: var(--suave); font-size: 14px; }
  .giro { width: 16px; height: 16px; border: 2px solid var(--linha-forte); border-top-color: var(--forte); border-radius: 50%; animation: giro .8s linear infinite; flex: none; }
  @keyframes giro { to { transform: rotate(360deg); } }

  .campo { display: grid; gap: 5px; min-width: 0; }
  .campo .topo { display: flex; align-items: center; gap: 6px; background: none; border-radius: 0; padding: 0; color: inherit; }
  .campo .topo .rotulo { margin: 0; }
  .campo .topo .editado { margin-left: auto; font-size: 11px; color: var(--fraco); }
  .ponto { width: 8px; height: 8px; border-radius: 50%; background: var(--linha-forte); flex: none; }
  .ponto.ok { background: var(--fraco); } .ponto.conferir { background: none; border: 1.5px solid var(--conferir); } .ponto.divergente { background: var(--divergente); }
  .campo.conferir .entrada { border: 1.5px dashed var(--conferir); background: var(--cartao); }
  .campo.divergente .entrada { border: 1.5px solid var(--divergente); background: var(--cartao); }
  .nota { font-size: 12.5px; color: var(--suave); line-height: 1.35; }
  .nota.divergente { color: var(--texto); font-weight: 600; } .nota.conferir { color: var(--conferir); }
  .opcoes { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .opcoes .rotulo { margin: 0 2px 0 0; font-size: 11px; }
  .opcao { min-height: 34px; padding: 5px 13px; border-radius: 999px; border: 1px solid var(--linha); background: var(--campo); font-size: 13px; text-align: left; overflow-wrap: anywhere; }
  .opcao:hover { border-color: var(--forte); }
  .opcao:disabled { opacity: .45; cursor: default; }
  .opcao.escolhida { border-color: var(--forte); background: var(--forte); color: var(--sobre-forte); }
  .duplo { display: grid; grid-template-columns: minmax(0, 1fr) 96px; gap: 10px; align-items: start; }
  .extras { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .faixa-caixa { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-radius: var(--raio-p); background: var(--campo); font-size: 13px; color: var(--suave); }
  .faixa-caixa b { color: var(--texto); }
  .avisos { margin: 0; padding: 10px 12px 10px 28px; font-size: 13px; color: var(--texto); background: var(--campo); border: 1px dashed var(--conferir); border-radius: var(--raio-p); }
  .avisos li.forte { font-weight: 700; }
  .rodape { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
  .rodape.dois { grid-template-columns: 1fr 1fr; }
  .perguntar { display: grid; gap: 10px; padding: 12px; border: 1px solid var(--linha-forte); border-radius: 14px; }
  .perguntar .nota b { color: var(--texto); }
  .juncao { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .consertar { display: flex; flex-wrap: wrap; gap: 8px; }
  .consertar .btn { flex: 1 1 140px; }
  .separar { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px, 1fr)); gap: 8px; }
  .separar button { position: relative; aspect-ratio: 1; padding: 0; border: 2px solid transparent; border-radius: 12px; overflow: hidden; background: var(--campo); cursor: pointer; }
  .separar button img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: .75; }
  .separar button.marcada { border-color: var(--forte); }
  .separar button.marcada img { opacity: 1; }
  .separar .num { position: absolute; left: 4px; bottom: 4px; background: rgba(0,0,0,.7); color: #fff; font-size: 11px; padding: 1px 7px; border-radius: 999px; }
  .msg-salvo { display: flex; gap: 8px; align-items: center; color: var(--texto); font-weight: 600; font-size: 14px; }
  .cartao.salvo .cab { padding-bottom: 6px; }

  /* ---------- painéis (NF, histórico, planilha, situação) ---------- */
  .fundo-painel { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 40; }
  .painel { position: fixed; z-index: 41; background: var(--fundo); display: flex; flex-direction: column; inset: 0; padding-top: env(safe-area-inset-top); }
  @media (min-width: 700px) {
    .painel { inset: 0 0 0 auto; width: 580px; }
    .painel.pequeno { inset: 10vh auto auto 50%; transform: translateX(-50%); width: 480px; max-height: 80vh; border-radius: 24px; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,.35); }
  }
  .painel-cab { display: flex; align-items: center; gap: 8px; padding: 10px 8px 10px 18px; background: var(--fundo); color: var(--texto); border-bottom: 1px solid var(--borda); }
  .painel-cab h2 { flex: 1; font-size: 17px; margin: 0; }
  .icone { width: 42px; height: 42px; border: 0; background: none; color: inherit; border-radius: 50%; display: grid; place-items: center; position: relative; flex: none; }
  .icone:hover { background: rgba(127,127,127,.2); }
  .icone svg { width: 22px; height: 22px; }
  .painel-corpo { flex: 1; overflow-y: auto; overflow-x: hidden; padding: 16px 16px calc(18px + env(safe-area-inset-bottom)); display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; align-content: start; }
  /* Nada passa da largura da tela: nomes longos quebram a linha em vez de alargar o painel. */
  .painel-corpo > *, main > * { min-width: 0; }
  .situacao, .dica, .estado-lista, .registro .t { overflow-wrap: anywhere; }
  .filtros { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 14px; white-space: nowrap; min-height: 44px; }
  .chk input { width: 20px; height: 20px; accent-color: var(--forte); }
  .estado-lista { font-size: 12.5px; color: var(--suave); }

  .registro { border: 0; border-radius: 16px; padding: 12px 14px; display: grid; gap: 3px; background: var(--cartao); text-align: left; width: 100%; box-shadow: var(--sombra); }

  .registro .t { font-weight: 600; }

  .registro.aprovar .tiras { display: flex; gap: 6px; overflow-x: auto; }
  .registro.aprovar .tiras img { width: 72px; height: 72px; object-fit: cover; border-radius: 10px; background: var(--fundo); }

  button.link { border: 0; background: none; padding: 0; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; }
  .registro .s { font-size: 13px; color: var(--suave); overflow-wrap: anywhere; }
  .registro.local { border: 1px dashed var(--linha-forte); }
  .secao { font-size: 11px; font-weight: 700; color: var(--suave); text-transform: uppercase; letter-spacing: .08em; margin-top: 6px; }
  .lista-planilhas { display: grid; gap: 8px; }
  .item-planilha { display: flex; gap: 8px; align-items: center; }
  .item-planilha .btn { flex: 1; min-width: 0; justify-content: flex-start; text-align: left; white-space: normal; overflow-wrap: anywhere; height: auto; min-height: var(--toque); padding: 10px 16px; line-height: 1.3; }
  .item-planilha .btn small { display: block; white-space: nowrap; font-weight: 400; font-size: 12px; margin-top: 2px; }
  .item-planilha .btn { flex-direction: column; align-items: flex-start; gap: 0; }
  .item-planilha .btn.ativa { background: var(--forte); color: var(--sobre-forte); }
  .item-planilha a.btn { flex: none; width: 46px; padding: 0; justify-content: center; }
  details.mais summary { cursor: pointer; font-size: 14px; color: var(--suave); padding: 6px 2px; }
  details.mais[open] { display: grid; gap: 8px; }
  .fotos-link { display: flex; gap: 6px; flex-wrap: wrap; }
  .fotos-link a { font-size: 13px; padding: 6px 12px; background: var(--campo); border-radius: 999px; text-decoration: none; }
  .situacao { display: grid; gap: 2px; padding: 14px; background: var(--cartao); border-radius: 16px; box-shadow: var(--sombra); }

  .kpi-cartao.escuro { border-color: var(--forte); }
  .temas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .temas .opcao { text-align: center; justify-content: center; display: flex; align-items: center; gap: 6px; }

  /* ---------- nota fiscal e auditoria ---------- */
  .modos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .modo { display: grid; justify-items: center; gap: 6px; padding: 14px 6px; border-radius: 16px; border: 0; background: var(--cartao); box-shadow: var(--sombra); font-size: 13px; font-weight: 600; text-align: center; }
  .modo svg { width: 26px; height: 26px; }
  .modo small { font-weight: 400; color: var(--suave); font-size: 11.5px; }
  .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
  #nfAuditoria, #nfLeitura { display: grid; gap: 10px; }
  #nfAuditoria { gap: 22px; }
  .auditoria { display: grid; gap: 10px; }
  .chips-nf { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip-nf { display: inline-flex; align-items: center; gap: 4px; height: 36px; padding: 0 4px 0 14px; border-radius: 999px; background: var(--forte); color: var(--sobre-forte); font-size: 13.5px; font-weight: 600; }
  .chip-nf button { width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent; color: inherit; font-size: 18px; line-height: 1; opacity: .7; }
  .chip-nf button:hover { opacity: 1; }
  #nfAuditoria:empty, #nfLeitura:empty { display: none; }
  .kpi-cartao { background: var(--cartao); border-radius: 16px; padding: 10px 10px 9px; box-shadow: var(--sombra); min-width: 0; }
  .kpi-cartao b { display: block; font-size: 24px; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi-cartao span { font-size: 11.5px; color: var(--suave); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kpi-cartao.escuro { background: var(--forte); color: var(--sobre-forte); }
  .kpi-cartao.escuro span { color: inherit; opacity: .7; }
  .item-nf { background: var(--cartao); border-radius: 16px; padding: 12px 14px; box-shadow: var(--sombra); display: grid; gap: 6px; border: 1px solid var(--borda); }
  .item-nf.CONFERIR { border: 1.5px dashed var(--conferir); }
  .item-nf.FALTA, .item-nf.SOBRA, .item-nf.FORA { border-color: var(--divergente); }
  .item-nf .l1 { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
  .item-nf .t { font-weight: 600; line-height: 1.3; }
  .item-nf .s { font-size: 12.5px; color: var(--suave); overflow-wrap: anywhere; }
  .item-nf ul { margin: 0; padding-left: 18px; font-size: 13px; }
  .barra-progresso { height: 8px; border-radius: 999px; background: var(--linha); overflow: hidden; }
  .barra-progresso i { display: block; height: 100%; background: var(--forte); border-radius: 999px; }
  .tabela-nf { display: grid; gap: 6px; }
  .tabela-nf .linha-nf { display: grid; grid-template-columns: minmax(0, 1fr) 64px; gap: 8px; align-items: center; background: var(--cartao); border-radius: 14px; padding: 10px 12px; box-shadow: var(--sombra); }

  /**

  // Uma foto de cada vez, para não disputar o processador do celular.
  var filaLeitura = Promise.resolve();
  function prepararFoto(arquivo) {
    var foto = { id: uuid(), n: 0, thumb: '', full: '', codigos: null, pronta: null, visual: null, quando: Date.now() };
    foto.pronta = carregarImagem(arquivo).then(function (img) {
      var c = desenhar(img, LADO_MAX);

      foto.thumb = desenhar(img, 240).toDataURL('image/jpeg', 0.7);

      foto.tremida = tremida(c);

  function adicionarArquivos(lista) {
    var arquivos = Array.prototype.filter.call(lista || [], function (f) { return /^image\//.test(f.type) || /\.(jpe?g|png|webp|heic)$/i.test(f.name); });
    var vagas = 30 - app.fotos.length;
    if (arquivos.length > vagas) aviso('Até 30 fotos por envio. Usei as primeiras ' + Math.max(0, vagas) + '.', true);
    arquivos.slice(0, Math.max(0, vagas)).forEach(function (f) { app.fotos.push(prepararFoto(f)); });
    renderMiniaturas();
  }

  function renderMiniaturas() {
    var box = $('miniaturas');
    box.innerHTML = app.fotos.map(function (f, i) {
      var cods = f.codigos ? f.codigos.length : null;
      return '<div class="mini">' + (f.thumb ? '<img src="' + f.thumb + '" alt="Foto ' + (i + 1) + '" data-ver="' + i + '">' : '<div class="progresso" style="height:100%;justify-content:center"><div class="giro"></div></div>') +
        '<span class="num">' + (i + 1) + '</span>' +
        (cods ? '<span class="cod" title="códigos de barras lidos">▮▮ ' + cods + '</span>' : (f.tremida && f.codigos ? '<span class="cod alerta" title="A foto pode estar tremida ou fora de foco">pode estar tremida</span>' : '')) +

  // ---------- produtos (cartões) ----------
  function novoCartao() {
    var caixa = $('caixa').value.trim();
    return {
      id: uuid(), planilhaId: app.planilha.id, planilhaNome: app.planilha.nome, aba: app.planilha.aba, extras: (app.planilha.extras || []).slice(), caixa: caixa, nfe: $('nfe').value.trim(),

  /**

   */

  /**
   * Separa as fotos enviadas juntas em produtos, pelos códigos lidos de cada uma.
   * Duas fotos são do mesmo produto quando têm um código em comum e não têm, cada uma,
   * um serial/IMEI que a outra não tem (mesmo modelo, aparelhos diferentes = 2 produtos).
   * Foto sem código nenhum vai junto com a próxima foto que tem código (ou com a anterior, se for a última).

  function agruparFotos(fotos) {

    var pedacos = [];
    grupos.forEach(function (g, gi) {

        g.fotos.forEach(function (f) { pedacos.push({ fotos: [f], info: g.info, origem: gi }); });
      } else {
        pedacos.push({ fotos: g.fotos, info: g.info, origem: gi });

        i++;
      } else {
        var irmao = juntos.filter(function (j) { return !j.feito && j.origem === a.origem; })[0];
        if (irmao) irmao.fotos = irmao.fotos.concat(a.fotos);
        else juntos.push({ fotos: a.fotos.slice(), origem: a.origem });

  }

  function enviar() {
    if (!app.planilha) { abrirPlanilhas(); aviso('Escolha a planilha antes de enviar.', true); return; }
    if (!app.fotos.length) return;
    var c = novoCartao();
    var fotos = app.fotos;
    app.fotos = [];
    clearTimeout(relogioAdiantar);
    var guardadas = adiantadas;
    adiantadas = {};
    renderMiniaturas();
    app.cartoes.unshift(c);
    renderCartao(c);
    // Espera ler os códigos de todas as fotos para saber quantos produtos são.
    Promise.all(fotos.map(function (f) { return f.pronta; })).then(function () {
      var grupos = agruparFotos(fotos.filter(function (f) { return f.full; }));
      if (!grupos.length) { descartar(c, true); return; }
      grupos.forEach(function (grupo, g) {
        var cartao = c;
        if (g > 0) {
          cartao = novoCartao();
          ['caixa', 'nfe', 'planilhaId', 'planilhaNome', 'aba', 'extras'].forEach(function (k) { cartao[k] = c[k]; });
          app.cartoes.unshift(cartao);
          renderCartao(cartao);
        }
        cartao.fotos = fotosDoCartao(grupo);
        var pronta = guardadas[assinaturaGrupo(grupo)];
        if (pronta && cartao.planilhaId === (app.planilha && app.planilha.id)) cartao.adiantada = pronta;
        Banco.salvar(cartao);
        processar(cartao);
      });

    });
  }

  function atualizar(c) { Banco.salvar(c); renderCartao(c); renderResumo(); }

  function processar(c, forcarIA) {
    c.erro = '';
    var etapa = Promise.resolve();
    // 1. códigos de barras (já lidos na hora da foto; só relê se faltar)
    if (c.fotos.some(function (f) { return !f.codigos && f.full; })) {
      c.estado = 'lendo'; atualizar(c);
      etapa = c.fotos.reduce(function (p, f) {
        if (f.codigos || !f.full) return p;
        return p.then(function () { return carregarImagem(dataParaBlob(f.full)).then(function (img) { return lerCodigos(desenhar(img, LADO_MAX)); }).then(function (cods) { f.codigos = cods; }); });

      t0 = Date.now();
      var opcoes = { registroId: c.id, planilhaId: c.planilhaId, extras: c.extras || [], forcarIA: !!forcarIA, nfe: c.nfe || '' };

      guardarEtiquetas(r, r.campos.EAN && r.campos.EAN.valor);
      if (r.memoria && r.memoria.confiavel && r.campos.DESCRICAO && r.campos.DESCRICAO.origem === 'memoria') guardarMemoria(eanDe(r.campos.EAN.valor), r.memoria);

        c.original[k] = r.campos[k].valor;

      c.estado = 'revisar'; c.etapa = '';
      atualizar(c);

      c.juntarCom = '';

      }

  /**

    if (o.forcarIA || !codigos.length || !(pedido.lote || pedido.nfe || pedido.memoriaLocal || vaiSemFotos(codigos))) return comFotos();

      anotarSemFotos(!r.precisaFotos);

  /**

   * Ao enviar, cada produto usa a leitura já pronta (ou em andamento) do mesmo grupo de fotos.

  var ESPERA_ADIANTAR_MS = 300, ESPERA_PREVIA_MS = 15000, adiantarDesde = 0;
  var ESPERA_ADIANTADA_MS = 20000;   // depois do Enviar, quanto a leitura adiantada pode demorar antes de ler de novo
  function assinaturaGrupo(grupo) { return grupo.map(function (f) { return f.id; }).join('|'); }
  function fotosDoCartao(grupo) { return grupo.map(function (f, i) { return { n: i + 1, thumb: f.thumb, full: f.full, codigos: f.codigos || [], visual: f.visual, quando: f.quando }; }); }
  function agendarAdiantar() {
    clearTimeout(relogioAdiantar);

  }
  function adiantar() {
    if (!app.planilha || !app.fotos.length) return;
    if (app.fotos.some(function (f) { return !f.full || !f.codigos; })) { agendarAdiantar(); return; }   // ainda lendo
    // A memória já está sendo consultada pela foto (preconsulta): espera ela responder (até 15 s) para a
    // leitura achar a resposta guardada, em vez de perguntar de novo ao mesmo tempo e esperar em dobro.
    var pendente = app.fotos.some(function (f) {
      return (f.codigos || []).some(function (k) { return ehEan(k.valor, k.formato) && previa[k.valor] === null; });
    });
    if (pendente && Date.now() - (adiantarDesde || (adiantarDesde = Date.now())) < ESPERA_PREVIA_MS) { agendarAdiantar(); return; }
    adiantarDesde = 0;
    var grupos = agruparFotos(app.fotos.slice());
    if (grupos.length > 10) return;
    grupos.forEach(function (grupo) {
      var k = assinaturaGrupo(grupo);
      if (adiantadas[k]) return;
      var p = identificar(fotosDoCartao(grupo), { registroId: '', planilhaId: app.planilha.id, extras: (app.planilha.extras || []).slice(), forcarIA: false, nfe: $('nfe').value.trim() });
      p.catch(function () { delete adiantadas[k]; });

    });
  }

  /**
   * Leituras no servidor: no máximo 2 ao mesmo tempo (várias fotos de uma vez não disputam a IA nem o
   * Google) e nenhuma fica "Identificando…" para sempre: passou do tempo, o cartão oferece tentar de novo.
   * Se a resposta chegar depois, ela ainda é usada.
   */
  var analisando = 0, esperando = [], VAGA_MAX_MS = 30000;
  function analisar(pedido) {
    var entrou = Date.now();
    return new Promise(function (ok, falha) {
      function ir() {
        analisando++;
        var espera = Date.now() - entrou;
        var c = app.cartoes.filter(function (x) { return x.id === pedido.registroId; })[0];
        var feito = false;
        var relogio = setTimeout(function () {
          if (feito || !c || c.estado !== 'analisando') return;
          c.tempoEsgotado = true;
          c.estado = 'falha';
          c.erro = 'A leitura está demorando demais. Toque em "Tentar de novo" (se a resposta chegar antes, ela aparece aqui sozinha).';
          atualizar(c);
        }, TEMPO_ANALISE_MS);
        // A vaga é devolvida quando a resposta chega ou, no máximo, em 30 s: um pedido preso não segura a fila.
        var solto = false;
        function soltar() { if (solto) return; solto = true; analisando--; var p = esperando.shift(); if (p) p(); }
        var relogioVaga = setTimeout(soltar, VAGA_MAX_MS);
        function fim() { feito = true; clearTimeout(relogio); clearTimeout(relogioVaga); soltar(); }
        chamar('apiAnalisar', pedido).then(function (r) {
          fim();
          if (r) { r.tempos = r.tempos || {}; r.tempos.espera = espera; }   // tempo na fila não é internet
          ok(r);
        }, function (e) { fim(); falha(e); });
      }
      if (analisando < LEITURAS_JUNTAS) ir(); else esperando.push(ir);
    });
  }

  /**
   * Perguntar primeiro sem as fotos só vale quando a memória costuma resolver. Se as 3 últimas vezes
   * precisaram das fotos (memória ainda vazia para esses produtos), manda as fotos direto e economiza
   * uma ida e volta inteira; de 5 em 5 leituras tenta de novo, para perceber quando a memória cresceu.
   */
  var pulosSemFotos = 0;
  function vaiSemFotos(codigos) {
    // A memória já foi consultada quando a foto foi tirada: sabe-se de antemão se ela conhece o produto.
    var eans = codigos.filter(function (k) { return ehEan(k.valor, k.formato); }).map(function (k) { return k.valor; });
    if (eans.some(function (e) { return previa[e] === true; })) return true;
    if (eans.length && eans.every(function (e) { return previa[e] === false; })) return false;
    var h = lembrar('semFotos', []);
    if (h.length < 3 || h.slice(-3).some(Boolean)) return true;

    return false;

  /**
   * Assim que os códigos da foto são lidos (antes de "Enviar"), pergunta à memória pelos EANs.

   */
  var previa = {};
  function preconsultar(cods, depois) {
    var eans = (cods || []).filter(function (k) { return ehEan(k.valor, k.formato) && !(k.valor in previa); }).map(function (k) { return k.valor; });
    if (!eans.length) { if (depois) depois(); return; }
    eans.forEach(function (e) { previa[e] = null; });
    chamar('apiPreconsultar', { eans: eans }).then(function (r) {
      var c = r.conhecidos || {}, nomes = r.nomes || {};
      eans.forEach(function (e) { previa[e] = e in c ? c[e] : false; if (nomes[e]) guardarMemoria(eanDe(e), nomes[e]); });   // sem resposta para ele = não conhecido
    }, function () { eans.forEach(function (e) { delete previa[e]; }); }).then(function () { if (depois) depois(); });

  // Fotos para o Drive, 3 de cada vez; reenviar não duplica. Um envio por produto de cada vez.
  var envios = {};
  function enviarFotos(c) {
    if (envios[c.id]) return envios[c.id];
    var faltam = c.fotos.filter(function (f) { return !f.driveId && f.full; });
    if (!faltam.length) return Promise.resolve();
    var i = 0;
    function trabalhador() {
      var f = faltam[i++];
      if (!f) return Promise.resolve();
      return chamar('apiEnviarFoto', { planilhaId: c.planilhaId, registroId: c.id, caixa: c.caixa, indice: f.n, base64: f.full }).then(function (r) {
        f.driveId = r.id; f.url = r.url; delete f.full; Banco.salvar(c);

    }
    envios[c.id] = Promise.all([trabalhador(), trabalhador(), trabalhador()]).then(function () { delete envios[c.id]; }, function (e) { delete envios[c.id]; throw e; });
    return envios[c.id];

    });

  function situacao(c) {
    if (c.estado === 'salvo') return { cls: 'ok', txt: c.automatico ? 'Salvo sozinho' : 'Salvo' };

  function mostrarNfe() {

      (v && pr && pr.total ? ' · ' + pr.lidos + ' de ' + pr.total + ' lidos' : '');

  }

  function htmlCampo(c, def) {
    var r = c.resultado, inf = r.campos[def.k] || { estado: def.k === 'QTDE' ? 'ok' : 'pendente' };
    var editado = !!c.editados[def.k];
    var estado = editado ? 'ok' : inf.estado;
    var v = c.valores[def.k] == null ? '' : c.valores[def.k];
    // Campo verde não leva explicação nem opções: só o que precisa de você aparece.

    var nota = limpo || def.k === 'QTDE' || def.extra ? '' : (inf.nota || '');
    var opcoes = limpo ? [] : (inf.opcoes || []).filter(function (o) { return o && o !== v; });   // o valor atual já está no campo
    var htmlOpcoes = opcoes.length
      ? '<div class="opcoes"><span class="rotulo">Ou</span>' + opcoes.map(function (o) {
        return '<button type="button" class="opcao' + (o === v ? ' escolhida' : '') + '" data-opcao="' + esc(def.k) + '" data-valor="' + esc(o) + '">' + esc(o) + '</button>';

    return '<div class="campo ' + (def.k === 'QTDE' ? '' : estado) + '"><div class="topo">' + ponto + '<label class="rotulo">' + def.t + '</label>' + (editado ? '<span class="editado">editado</span>' : '') + '</div>' +
      entrada + htmlOpcoes + (nota ? '<div class="nota ' + estado + '">' + esc(nota) + '</div>' : '') + fontes + '</div>';
  }

  function tituloExtra(k) {
    var e = (app.extrasDisponiveis || []).filter(function (x) { return x.chave === k; })[0];
    return e ? (e.titulo.charAt(0) + e.titulo.slice(1).toLowerCase()).replace(/\bram\b/, 'RAM') : k;
  }

  function faixaCaixa(c) {
    var t = app.totais[chaveCaixa(c.caixa)];
    var q = Number(String(c.valores.QTDE || '1').replace(',', '.')) || 0;
    if (!chaveCaixa(c.caixa)) return '';
    return '<div class="faixa-caixa"><span>Caixa <b>' + esc(c.caixa) + '</b>' + (t == null ? '' : ' fica com <b>' + (t + q) + '</b> ' + (t + q === 1 ? 'produto' : 'produtos') + ' ao salvar') + '</span></div>';
  }

  function renderCartao(c) {
    var el = document.querySelector('[data-cartao="' + c.id + '"]');
    if (!el) {

      var lista = $('resultados');

    }
    var s = situacao(c);
    el.className = 'cartao ' + s.cls + (c.estado === 'salvo' ? ' salvo' : '') + (noDestino(c) ? '' : ' oculto');
    var tiras = c.fotos.slice(0, 3).map(function (f, i) { return '<img src="' + f.thumb + '" alt="Foto ' + (i + 1) + '" data-ver-cartao="' + c.id + '" data-i="' + i + '">'; }).join('');

      : '<div class="sub">' + fotos + ' · ' + hora(c.criadoEm) + (c.tempo ? ' · ⏱ ' + seg(c.tempo) : '') + '</div>';
    var cab = '<div class="cab"><div class="tiras">' + tiras + '</div><div class="info">' + info + '</div><span class="selo ' + s.cls + '">' + s.txt + '</span></div>';

    } else if (c.estado === 'salvo') {

      corpo = '<div class="nota">' + [c.valores.SERIAL && 'Serial ' + esc(c.valores.SERIAL), c.valores.EAN && 'EAN ' + esc(c.valores.EAN), Number(c.valores.QTDE) > 1 && 'Qtde ' + esc(c.valores.QTDE)].filter(Boolean).join(' · ') + '</div>' +
        (prNf ? '<div class="nota">' + esc(prNf) + '</div>' : '') + htmlJuncao(c) +
        '<div class="rodape dois"><button class="btn sec curto" type="button" data-acao="corrigir">Corrigir</button><button class="btn sec curto" type="button" data-acao="fechar">Ocultar</button></div>';
    } else {

      var avisos = (r.divergencias || []).map(function (d) { return '<li class="forte">' + esc(d) + '</li>'; }).concat((r.avisos || []).map(function (a) { return '<li>' + esc(a) + '</li>'; })).join('');
      var falta = pendencias(c);

      var botaoIA = !r.usouIA ? '<button class="btn sec" type="button" data-acao="ia" title="Ler as fotos com IA">IA</button>' : '';
      var rotulo = falta.length ? 'Escolha ' + falta.map(function (k) { return NOMES[k]; }).join(' e ') : ((r.divergencias || []).length ? 'Salvar mesmo assim' : 'Salvar');
      var extras = (c.extras || []).map(function (k) { return htmlCampo(c, { k: k, t: tituloExtra(k), extra: true }); }).join('');
      corpo = htmlCampo(c, porK.DESCRICAO) + htmlCampo(c, porK.SERIAL) +

        '<div class="duplo">' + htmlCampo(c, porK.EAN) + htmlCampo(c, porK.QTDE) + '</div>' +
        faixaCaixa(c) +
        (avisos ? '<ul class="avisos">' + avisos + '</ul>' : '') +
        (c.estado === 'falha' ? '<div class="nota divergente">' + esc(c.erro) + '</div>' : '') +
        '<div class="rodape"><button class="btn principal grande" type="button" data-acao="salvar"' + (falta.length || c.estado === 'salvando' ? ' disabled' : '') + '>' + (c.estado === 'salvando' ? 'Salvando…' : rotulo) + '</button>' +

  // ---------- salvar sozinho e juntar dados que chegam depois ----------
  var JUNTAR_MS = 30 * 60000, JUNTAR_LOGO_MS = 3 * 60000;
  var TRES = ['DESCRICAO', 'EAN', 'SERIAL'];
  function temValor(c, k) { return !!String(c.valores[k] || '').trim(); }

  /**
   * Grava sozinho quando nada pede escolha e falta no máximo um dos três (EAN, serial, descrição).
   * O que veio preenchido precisa estar conferido: um dado em dúvida espera você.
   */
  function podeSalvarSozinho(c) {
    var r = c.resultado;
    if (!r || (r.divergencias || []).length || Object.keys(c.editados).length || pendencias(c).length) return false;
    if (r.situacao === 'pronto') return true;

  }
  /** Dois produtos se contradizem? (EAN ou serial diferentes, os dois preenchidos) */
  function contradiz(a, b) {
    var ea = eanDe(a.valores.EAN) || '', eb = eanDe(b.valores.EAN) || '';

  }
  /**

    var achado = null;
    (codigos || []).some(function (k) { var x = l[planilhaId + ':' + k.valor]; if (x) achado = x; return !!x; });
    return achado ? { ean: achado.ean, descricao: achado.descricao, marca: achado.marca, seriais: achado.seriais } : null;
  }
  /** Corrigiu um produto salvo: o lote do EAN antigo sai e, com descrição corrigida, o do EAN certo usa a correção. */
  function corrigirLote(planilhaId, campos, novos) {
    if (!('DESCRICAO' in novos) && !('EAN' in novos)) return;
    var l = lotes(), velho = planilhaId + ':' + (campos.EAN || '');
    var ean = 'EAN' in novos ? novos.EAN : campos.EAN, desc = 'DESCRICAO' in novos ? novos.DESCRICAO : campos.DESCRICAO;
    var ant = l[velho];
    delete l[velho];
    esquecerMemoria(eanDe(campos.EAN));
    if (ean && desc && /^\d{8,14}$/.test(ean)) {
      l[planilhaId + ':' + ean] = { ean: ean, descricao: desc, marca: campos.MARCA || '', seriais: ant ? ant.seriais : [], quando: Date.now() };
    }
    guardar('lotes', l);
  }

  /**
   * Ensinar a Memória Global fica numa fila guardada no aparelho: não atrasa a gravação e não se perde
   * sem internet ou com a memória fora do ar. A memória ignora repetição (cada produto tem um id fixo).
   */
  function ensinarMemoria(c) {
    if (!app.memoriaLigada || !c.resultado || app.ajuda) return;
    var d = c.resultado.campos.DESCRICAO || {};
    var corrigida = !!(c.editados.DESCRICAO && (c.valores.DESCRICAO || '') !== (c.original.DESCRICAO || ''));
    var fila = lembrar('ensinar', []).filter(function (x) { return x.registroId !== c.id; });
    fila.push({
      registroId: c.id, ean: c.valores.EAN, descricao: c.valores.DESCRICAO,
      descricaoOrigem: corrigida ? 'humano' : d.origem, descricaoConfirmada: !corrigida && d.estado === 'ok',
      descricaoCorrigida: corrigida, itemMemoria: c.resultado.memoria && c.resultado.memoria.item_id,
      serial: c.valores.SERIAL, nfe: c.nfe, etiquetas: c.resultado.etiquetas || [], tentativas: 0
    });
    guardar('ensinar', fila.slice(-200));
    if (corrigida) esquecerMemoria(eanDe(c.valores.EAN));
    delete previa[c.valores.EAN];   // a memória vai aprender: a próxima foto desse EAN pergunta de novo
    esvaziarEnsino();
  }
  var ensinando = false;
  function esvaziarEnsino() {
    if (ensinando || app.ajuda) return;
    var fila = lembrar('ensinar', []);
    if (!fila.length) return;
    ensinando = true;
    var item = fila[0];
    function tirar() { guardar('ensinar', lembrar('ensinar', []).filter(function (x) { return x.registroId !== item.registroId; })); }
    chamar('apiAprender', item).then(function (r) {
      var m = r.memoria || {};
      if (m.tentarDeNovo && item.tentativas < 10) {   // memória fora do ar: tenta mais tarde
        guardar('ensinar', lembrar('ensinar', []).map(function (x) { if (x.registroId === item.registroId) x.tentativas = (x.tentativas || 0) + 1; return x; }));
        ensinando = false;
        setTimeout(esvaziarEnsino, 60000);
        return;
      }
      tirar();
      ensinando = false;
      esvaziarEnsino();
    }, function (e) {
      ensinando = false;
      if (e && e.codigo === 'SEM_CONEXAO') { setTimeout(esvaziarEnsino, 60000); return; }
      tirar();                     // erro do próprio pedido: tentar de novo não resolve
      esvaziarEnsino();
    });
  }

  /**
   * A tela inicial mostra o que está na aba: produto salvo que foi apagado na planilha some daqui,
   * e a linha mostrada acompanha a planilha. Os que ainda não foram salvos ficam.
   */
  var conferindoTela = false;
  function conferirTela() {
    if (conferindoTela || app.ajuda || !app.planilha || document.hidden) return;
    var inicio = Date.now();
    var salvos = app.cartoes.filter(function (c) { return c.estado === 'salvo' && !c.paraAprovar && noDestino(c) && (c.salvoEm || 0) < inicio; });
    if (!salvos.length) return;
    conferindoTela = true;
    chamar('apiConferirTela', { planilhaId: app.planilha.id, aba: app.planilha.aba, ids: salvos.map(function (c) { return c.id; }) }).then(function (r) {
      salvos.forEach(function (c) {
        var linha = r.linhas[c.id];
        if (!linha) {
          app.cartoes = app.cartoes.filter(function (x) { return x !== c; });
          var el = document.querySelector('[data-cartao="' + c.id + '"]');
          if (el) el.remove();
          Banco.apagar(c.id);
        } else if (linha !== c.linha) { c.linha = linha; atualizar(c); }
      });
      renderResumo();
    }).catch(function () { /* confere de novo depois */ }).then(function () { conferindoTela = false; });
  }
  setInterval(function () { if (!app.painel) conferirTela(); }, 30000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) conferirTela(); });

  // ---------- painéis ----------
  var NAV = { notas: 'btnNotas', historico: 'btnHistorico', config: 'btnConfig' };
  function marcarNav(nome) {
    ['btnInicio', 'btnNotas', 'btnHistorico', 'btnConfig'].forEach(function (id) { $(id).classList.toggle('ativo', id === (NAV[nome] || 'btnInicio')); });
  }
  function abrirPainel(nome, titulo, html, pequeno) {
    app.painel = nome;
    marcarNav(nome);
    $('painelTitulo').textContent = titulo;
    $('painelCorpo').innerHTML = html;
    $('painel').className = 'painel' + (pequeno ? ' pequeno' : '');
    $('fundoPainel').className = 'fundo-painel';
  }
  function fecharPainel() {
    app.painel = null;
    marcarNav(null);
    $('painel').className = 'painel oculto';
    $('fundoPainel').className = 'fundo-painel oculto';
    clearInterval(app.timerHistorico);
    conferirTela();
  }

  function itemPlanilha(p, extra) {
    var ativa = app.planilha && app.planilha.id === p.id;
    return '<div class="item-planilha"><button class="btn' + (ativa ? ' ativa' : ' sec') + '" type="button" data-usar="' + esc(p.id) + '"' + (p.aba ? ' data-usar-aba="' + esc(p.aba) + '"' : '') + '>' +
      '<span>' + (ativa ? '✓ ' : '') + esc(p.nome) + '</span>' + (extra ? '<small style="opacity:.7">' + esc(extra) + '</small>' : '') + '</button>' +
      '<a class="btn sec" href="' + esc(p.url) + '" target="_blank" rel="noopener" aria-label="Abrir planilha">↗</a></div>';
  }

  /**
   * Painel em ordem: 1) a planilha conectada; 2) aba e informações (só com planilha);
   * 3) conectar/trocar: planilhas da sua conta Google já listadas, busca e link.
   */
  function abrirPlanilhas() {
    if (app.ajuda) { abrirAjudar(app.destinoAjuda || { dono: app.ajuda.dono, abas: app.ajuda.abas || [app.ajuda.aba] }); return; }
    var atual = app.planilha;
    var html = '<div class="secao">Planilha conectada</div>' + (atual
      ? '<div class="situacao"><div class="t"><span>' + esc(atual.nome) + '</span><a class="btn sec curto" href="' + esc(atual.url) + '" target="_blank" rel="noopener">Abrir ↗</a></div><div class="s">Os produtos vão para a aba <b>' + esc(atual.aba) + '</b>.</div></div>'
      : '<div class="situacao"><div class="t">Nenhuma planilha conectada</div><div class="s">Escolha abaixo uma planilha da sua conta Google ou cole o link.</div></div>');
    if (atual) {
      var abas = atual.abas || [{ nome: atual.aba, scan: true }];
      html += '<div class="secao">Aba de destino</div>' +
        '<div class="opcoes">' + abas.map(function (x) {
          var usavel = x.scan || x.vazia;
          return '<button type="button" class="opcao' + (x.nome === atual.aba ? ' escolhida' : '') + '"' + (usavel ? ' data-aba="' + esc(x.nome) + '"' : ' disabled title="Esta aba tem outros dados"') + '>' + esc(x.nome) + (usavel ? '' : ' · outros dados') + '</button>';
        }).join('') + '</div>' +
        '<div class="filtros"><input class="entrada" id="novaAba" placeholder="Nova aba (ex.: Novembro)" autocomplete="off"><button class="btn sec" type="button" id="btnNovaAba">Criar e usar</button></div>';
      if ((app.extrasDisponiveis || []).length) {
        html += '<div class="secao">Informações que esta aba recebe</div>' +
          '<div class="opcoes">' + app.extrasDisponiveis.map(function (e) {
            var tem = (atual.extras || []).indexOf(e.chave) >= 0;
            return '<button type="button" class="opcao' + (tem ? ' escolhida' : '') + '"' + (tem ? ' aria-disabled="true"' : ' data-extra="' + esc(e.chave) + '"') + '>' + (tem ? '✓ ' : '+ ') + esc(tituloExtra(e.chave)) + '</button>';
          }).join('') + '</div>' +
          '<p class="dica" style="margin:0">Cada informação marcada vira uma coluna e sai da descrição. Para tirar, apague a coluna na planilha.</p>';
      }
    }
    html += '<div class="secao">' + (atual ? 'Trocar de planilha' : 'Conectar uma planilha') + '</div>' +
      '<p class="dica" style="margin:0">' + (app.email ? 'Conta Google conectada: <b>' + esc(app.email) + '</b>. ' : 'Conta Google do SCAN conectada. ') + 'Estas são as planilhas dela, das mais recentes para as mais antigas. Para usar outra conta, veja Situação → Conta Google.</p>' +
      '<input class="entrada" id="buscaDrive" type="search" placeholder="Procurar pelo nome da planilha" autocomplete="off">' +
      '<div class="lista-planilhas" id="resultadoDrive"><div class="progresso"><span class="giro"></span>Carregando suas planilhas…</div></div>' +
      '<details class="mais"><summary>Colar o link de uma planilha</summary>' +
      '<input class="entrada" id="linkPlanilha" placeholder="https://docs.google.com/spreadsheets/d/…" autocomplete="off">' +
      '<button class="btn principal" type="button" id="btnUsarLink">Usar esta planilha</button></details>' +
      '<p class="dica" style="margin:0">Uso as abas que já existem: se a planilha já tiver as colunas do SCAN, sigo o formato dela; se tiver uma aba vazia, coloco nela as colunas padrão. Só crio a aba SCAN se todas as abas tiverem outros dados.</p>';
    abrirPainel('planilha', 'Planilha', html, true);
    buscarNoDrive();
  }

  function adicionarExtra(botao) {
    botao.disabled = true;
    chamar('apiAdicionarExtra', { planilhaId: app.planilha.id, aba: app.planilha.aba, chave: botao.getAttribute('data-extra') }).then(function (r) {
      definirPlanilha(r.planilha);
      abrirPlanilhas();
      aviso('Coluna criada na aba ' + r.planilha.aba + '.' + (r.preenchidas ? ' Preenchi ' + r.preenchidas + (r.preenchidas === 1 ? ' produto já lido' : ' produtos já lidos') + ' pela descrição.' : ' Vale para os próximos produtos.'));
    }).catch(function (e) { botao.disabled = false; aviso(e.message, true); });
  }

  var buscaDriveN = 0;
  function buscarNoDrive() {
    var n = ++buscaDriveN;
    var termo = $('buscaDrive') ? $('buscaDrive').value.trim() : '';
    chamar('apiMinhasPlanilhas', termo).then(function (r) {
      if (n !== buscaDriveN || !$('resultadoDrive')) return;
      var lista = r.planilhas.filter(function (p) { return !app.planilha || p.id !== app.planilha.id; });
      // Uma lista só, das mais recentes para as mais antigas; as que você já usou levam a aba de antes.
      var usadas = {};
      (app.planilhas || []).forEach(function (p) { usadas[p.id] = p; });
      $('resultadoDrive').innerHTML = lista.length ? lista.map(function (p) {
        var u = usadas[p.id];
        return itemPlanilha(u ? Object.assign({}, p, { aba: u.aba }) : p, (p.atualizada || '') + (u && u.aba ? ' · usada na aba ' + u.aba : ''));
      }).join('')
        : '<p class="dica" style="margin:0">' + (termo ? 'Nenhuma planilha com esse nome.' : 'Nenhuma outra planilha na sua conta.') + '</p>';
    }).catch(function (e) {
      if (n === buscaDriveN && $('resultadoDrive')) $('resultadoDrive').innerHTML = '<div class="estado-lista erro">' + esc(e.message) + '</div>';
    });
  }

  function usarPlanilha(linkOuId, botao, aba) {
    var texto = botao ? botao.innerHTML : '';
    if (botao) { botao.disabled = true; botao.textContent = 'Abrindo…'; }
    return chamar('apiEscolherPlanilha', linkOuId, aba || '').then(function (r) {
      definirPlanilha(r.planilha);
      app.planilhas = [r.planilha].concat(app.planilhas.filter(function (p) { return p.id !== r.planilha.id; }));
      fecharPainel();
      aviso('Gravando em "' + r.planilha.nome + '", aba ' + r.planilha.aba + ' (' + r.total + ' registro(s)).' + (r.planilha.criadas.length ? ' Criei: ' + r.planilha.criadas.join(', ') + '.' : ''));
    }).catch(function (e) {
      if (botao) { botao.disabled = false; botao.innerHTML = texto; }
      aviso(e.message, true);
    });
  }

  function definirPlanilha(p) {
    app.planilha = p;

    $('nomePlanilha').innerHTML = p ? esc(p.aba) + ' <small>· ' + esc(p.nome) + '</small>' : 'Escolher planilha';

  /** Tema escuro (padrão) ou claro, guardado no aparelho. O <head> já aplica antes de desenhar a tela. */

  function usarTema(t) {

  function abrirConfig() {
    function linha(titulo, ligado, txt) {

    }

  // ---------- código pessoal, ajuda e aprovação ----------
  function blocoAprovar() {

      '<div class="s">' + (n === 1 ? 'Um produto mandado' : n + ' produtos mandados') + ' por quem usou o seu código. Só entram na planilha quando você aprovar.</div></div>' : '';
  }
  /**
   * Conta Google em uso e troca de conta. O Google decide a conta pelo endereço, então trocar = abrir o
   * seletor de contas do Google, que volta para o SCAN com a conta escolhida (a página inteira, não só o quadro).
   */
  // O Google só abre o SCAN (app da Web) com a primeira conta conectada no navegador; escolher outra no

  function linkApp() { return (SITE && SITE.url) || app.urlApp || (window.top === window ? location.href : ''); }
  function copiarLinkApp(botao) {

        '<div class="s">Você é <b>' + esc(app.ajuda.nome) + '</b> e manda para a aba <b>' + esc(app.ajuda.aba) + '</b>. A pessoa aprova no SCAN dela. <button class="link" type="button" id="btnAjudar">Trocar aba</button></div></div>';

      '<div class="kpi" style="font-size:28px;font-weight:700;letter-spacing:.12em;margin:4px 0">' + esc(app.meuCodigo || (app.erroCodigo ? '—' : '…')) + '</div>' +
      (!app.meuCodigo && app.erroCodigo ? '<div class="nota divergente" style="margin-bottom:6px">' + esc(app.erroCodigo) + ' <button class="link" type="button" id="btnCodigoDeNovo">Tentar de novo</button></div>' : '') +
      '<div class="s">Opcional. Passe só para quem vai ajudar você sem ver a sua planilha: a pessoa vê só os nomes das abas, e o que ela ler chega aqui em "Para aprovar".</div></div>' +

      '<div class="s">Digite o código de outra pessoa para mandar produtos para a planilha dela.</div></div>';

  /** O código não veio ao abrir: pede de novo (uma vez por abertura do painel) e mostra o motivo se falhar. */
  var buscandoCodigo = false;
  function buscarCodigo() {
    if (buscandoCodigo || app.meuCodigo || app.ajuda) return;
    buscandoCodigo = true;
    chamar('apiMeuCodigo').then(function (r) {
      app.meuCodigo = r.meuCodigo || ''; app.erroCodigo = r.erroCodigo || ''; app.erroCodigo = ''; app.paraAprovar = r.paraAprovar || app.paraAprovar;

      .then(function () { buscandoCodigo = false; if (app.painel === 'config') abrirConfig(); });

  function trocarCodigo(botao) {
    if (!window.confirm('Gerar um código novo? O código atual para de funcionar na hora. O que já está esperando aprovação continua.')) return;

    if (!app.meuCodigo) { app.erroCodigo = ''; buscarCodigo(); return; }
    chamar('apiTrocarCodigo').then(function (r) { app.meuCodigo = r.meuCodigo; abrirConfig(); aviso('Código novo: ' + r.meuCodigo); })
      .catch(function (e) { botao.disabled = false; aviso(e.message, true); });

  /** Painel para começar a ajudar: código da outra pessoa, seu nome e a aba. */
  function abrirAjudar(destino) {
    var a = app.ajuda || {};

  // ---------- velocidade (tempo de cada etapa, guardado no aparelho) ----------

  function mediana(l) { if (!l.length) return 0; var o = l.slice().sort(function (a, b) { return a - b; }); return o[Math.floor(o.length / 2)]; }

    return nome + ': ' + como + ' em ' + seg(t.ms || 0);
  }
  function blocoVelocidade() {
    var l = lembrar('tempos', []).filter(function (t) { return t && t.total; });

    var partes = [

      comIA.length ? 'IA: ' + seg(mediana(comIA.map(function (t) { return t.ia; }))) + ' (em ' + comIA.length + ' de ' + l.length + ')' : 'IA: não precisou',

      'Internet e envio: ' + seg(mediana(l.map(function (t) { return t.rede || 0; }))),

      var chave = (fotos.filter(function (f) { return f.chave; })[0] || {}).chave || '';

    }).then(function (r) { mostrarLeitura(r.notas); })
      .catch(function (e) { if ($('nfLeitura')) $('nfLeitura').innerHTML = '<div class="estado-lista erro">' + esc(e.message || 'Não consegui abrir as fotos.') + '</div>'; });
  }

  function lerNfXml(arquivo) {
    if (!arquivo) return;
    progressoNf('nfLeitura', 'Lendo o XML da nota…');
    var leitor = new FileReader();
    leitor.onload = function () {
      chamar('apiLerNfXml', { xml: String(leitor.result || '') }).then(function (r) { mostrarLeitura(r.notas); })
        .catch(function (e) { $('nfLeitura').innerHTML = '<div class="estado-lista erro">' + esc(e.message) + '</div>'; });
    };
    leitor.onerror = function () { $('nfLeitura').innerHTML = '<div class="estado-lista erro">Não consegui abrir esse arquivo.</div>'; };
    leitor.readAsText(arquivo);
  }

  function lerNfPdf(arquivo) {
    if (arquivo.size > 15 * 1024 * 1024) { $('nfLeitura').innerHTML = '<div class="estado-lista erro">Esse PDF é grande demais (máx. 15 MB).</div>'; return; }
    progressoNf('nfLeitura', 'Lendo o PDF da nota…');
    lerBase64(arquivo).then(function (b64) { return chamar('apiLerNfFotos', { pdf: b64 }); })
      .then(function (r) { mostrarLeitura(r.notas); })
      .catch(function (e) { if ($('nfLeitura')) $('nfLeitura').innerHTML = '<div class="estado-lista erro">' + esc(e.message || 'Não consegui abrir o PDF.') + '</div>'; });
  }

  function lerNfArquivo(arquivo) {
    if (arquivo.size > 10 * 1024 * 1024) { $('nfLeitura').innerHTML = '<div class="estado-lista erro">Essa planilha é grande demais (máx. 10 MB).</div>'; return; }
    progressoNf('nfLeitura', 'Lendo a planilha da NF…');
    lerBase64(arquivo).then(function (b64) { return chamar('apiLerNfArquivo', { nome: arquivo.name, base64: b64 }); })
      .then(function (r) { mostrarLeitura(r.notas); })
      .catch(function (e) { if ($('nfLeitura')) $('nfLeitura').innerHTML = '<div class="estado-lista erro">' + esc(e.message || 'Não consegui abrir a planilha.') + '</div>'; });
  }

  function lerBase64(arquivo) {
    return new Promise(function (ok, falha) {
      var leitor = new FileReader();
      leitor.onload = function () { ok(String(leitor.result || '').replace(/^data:[^,]*,/, '')); };
      leitor.onerror = function () { falha(new Error('Não consegui abrir esse arquivo.')); };
      leitor.readAsDataURL(arquivo);
    });
  }

  /** Arquivos arrastados (ou escolhidos) para a tela da NF: cada tipo vai para a leitura certa. */
  function arquivosNf(lista) {
    var arquivos = Array.prototype.slice.call(lista || []);
    if (!arquivos.length) return;
    function ext(f) { return (String(f.name || '').toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || ''; }
    var fotos = arquivos.filter(function (f) { return /^image\//.test(f.type) || /^(jpe?g|png|heic|webp)$/.test(ext(f)); });
    var outro = arquivos.filter(function (f) { return fotos.indexOf(f) < 0; })[0];
    if (fotos.length && !outro) return lerNfFotos(fotos);
    if (!outro) return;
    var e = ext(outro);
    if (e === 'xml' || /xml/.test(outro.type)) return lerNfXml(outro);
    if (e === 'pdf' || outro.type === 'application/pdf') return lerNfPdf(outro);
    if (/^(xlsx|xls|ods|csv|txt)$/.test(e)) return lerNfArquivo(outro);
    $('nfLeitura').innerHTML = '<div class="estado-lista erro">Esse tipo de arquivo não serve para a NF. Use foto, PDF, XML ou planilha (.xlsx, .xls, .csv).</div>';
  }

  function lerNfPlanilha() {

      '<div class="s">' + esc([n.emitente, n.emissao, n.chave ? 'chave …' + n.chave.slice(-8) : ''].filter(Boolean).join(' · ')) + '</div></div>' +

          '<input class="entrada" data-qtd-nf="' + i + '" inputmode="decimal" value="' + esc(it.qtd) + '" aria-label="Quantidade"></div>';
      }).join('') + '</div>' +

  function salvarNf(substituir) {
    if (!nfLida) return;

    });
    var envio = { numero: nfLida.numero, chave: nfLida.chave, emitente: nfLida.emitente, emissao: nfLida.emissao, origem: nfLida.origem,

    }).catch(function (e) { botao.disabled = false; botao.textContent = 'Guardar e auditar'; aviso(e.message, true); });

    }).join('');

  var EDITAVEIS = [['DESCRICAO', 'Descrição'], ['SERIAL', 'Serial / IMEI'], ['EAN', 'EAN'], ['QTDE', 'Qtde'], ['DATA', 'Data'], ['CAIXA', 'Caixa'], ['NFE', 'NF-e']];
  function editarLinha(i) {
